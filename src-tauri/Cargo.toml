[package]
name = "peroperochat"
version = "1.4.12"
description = "Your better friend"
authors = ["you"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.3", features = [] }

[dependencies]
tauri = { version = "2.2.5", features = ["tray-icon"] }
tauri-plugin-shell = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "multipart", "rustls-tls-webpki-roots"], default-features = false }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tauri-plugin-haptics = "2.3.2"
tauri-plugin-notification = "2.3.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
sha2 = "0.10"
triviumdb = { version = "=0.8.8", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "=2.4.6"

[target.'cfg(target_os = "ios")'.dependencies]
security-framework = "3.7"

[dev-dependencies]
jni = "=0.21.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
notify-rust = "=4.12.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
