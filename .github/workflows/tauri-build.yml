name: Tauri Build

on:
  push:
    tags: [ '*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 默认的 tools 包已不可用，显式安装项目所需的 SDK 组件。
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Initialize Android project (preserve custom native code)
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Android project not found, initializing..."
            pnpm tauri android init --ci
          else
            echo "Android project already exists, skipping init to preserve custom code"
          fi
        env:
          CI: true

      - name: Read version from tauri.conf.json
        id: version
        run: |
          VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version: $VERSION"

      - name: Build Android APK (aarch64 only, split per ABI)
        run: pnpm tauri android build --apk --split-per-abi --target aarch64
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          OPENSSL_DIR: /usr/lib/ssl

      - name: Ensure debug keystore exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Sign APK with debug key
        run: |
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/* | sort -r | head -1)
            echo "Using build-tools: $BUILD_TOOLS"
            $BUILD_TOOLS/zipalign -v 4 "$APK_PATH" app-aligned.apk
            $BUILD_TOOLS/apksigner sign --ks ~/.android/debug.keystore --ks-pass pass:android --key-pass pass:android --out PeroperoChat-v${{ steps.version.outputs.version }}-arm64.apk app-aligned.apk
          else
            echo "APK not found!"
            find src-tauri/gen/android -name "*.apk" || true
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PeroperoChat-android-arm64
          path: PeroperoChat-v${{ steps.version.outputs.version }}-arm64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: PeroperoChat v${{ steps.version.outputs.version }}
          # 手动触发时 ref_name 是分支名，发布标签统一使用应用版本。
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            ## PeroperoChat v${{ steps.version.outputs.version }}

            ### 独立陪伴模式与角色房间
            - 精简 ReAct、提示词框架与四类模型 API，支持思考强度和扩展参数
            - TDB 角色日记、统一状态与互动台词工具，以及事务提交和删除兜底
            - Pero、Nana 独立房间，统一设置与管理界面，衣柜缩略和轻量交互动效
            - 本地服务商与模型品牌图标自适应显示
            - 安卓系统提醒登记、JNI/Rust 冷启动处理、重复续排及开机解锁恢复

            ### 验证情况
            - 提交前本地前端 35 项、Rust 后端 52 项测试通过
            - 未执行本地应用构建；原生界面端到端与安卓真机验收尚未完成
            - 系统强制停止、通知权限和厂商后台限制仍会影响提醒

            ### 📦 下载
            - `PeroperoChat-v${{ steps.version.outputs.version }}-arm64.apk` — Android ARM64 安装包
          draft: false
          prerelease: false
          files: |
            PeroperoChat-v${{ steps.version.outputs.version }}-arm64.apk
