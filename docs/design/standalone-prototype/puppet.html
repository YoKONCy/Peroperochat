<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Pero · 分层 SVG 互动试作</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; }
    #puppet { width: 100%; height: 100%; outline: none; touch-action: pan-y; -webkit-tap-highlight-color: transparent; cursor: pointer; }
    #puppet > svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #puppet:focus-visible { outline: 2px dashed #467fc580; outline-offset: -5px; border-radius: 14px; }
  </style>
  <script src="puppet-model.js" defer></script>
  <script src="puppet.js" defer></script>
</head>
<body><main id="puppet" tabindex="0" role="button" aria-label="轻触角色打招呼，移动指针可跟随视线"></main></body>
</html>
