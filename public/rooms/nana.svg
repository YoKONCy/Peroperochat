<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" fill="none">
  <title>Nana 的紫夜房间</title>
  <desc>紫粉配色的动漫房间，窗外是暮色城市，电脑桌摆着耳机与手柄，床边有星形靠垫和唱片，中央留给角色。</desc>
  <defs>
    <linearGradient id="wall" x2=".8" y2="1"><stop stop-color="#f3eaff"/><stop offset=".55" stop-color="#e3d6fa"/><stop offset="1" stop-color="#bfabe5"/></linearGradient>
    <linearGradient id="side" x2="1" y2="1"><stop stop-color="#a78ed0"/><stop offset="1" stop-color="#d1b9ea"/></linearGradient>
    <linearGradient id="sky" y2="1"><stop stop-color="#6463b2"/><stop offset=".55" stop-color="#b18ad4"/><stop offset="1" stop-color="#f5bad9"/></linearGradient>
    <linearGradient id="floor" y2="1"><stop stop-color="#a393c0"/><stop offset="1" stop-color="#d8c0da"/></linearGradient>
    <linearGradient id="curtain" x2="1"><stop stop-color="#8773ba"/><stop offset=".22" stop-color="#b5a0dc"/><stop offset=".5" stop-color="#927ac1"/><stop offset=".75" stop-color="#bda6e5"/><stop offset="1" stop-color="#8972b5"/></linearGradient>
    <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#4d65a7"/><stop offset=".5" stop-color="#9b74ce"/><stop offset="1" stop-color="#f1a5d5"/></linearGradient>
    <linearGradient id="quilt" x2=".3" y2="1"><stop stop-color="#eaddff"/><stop offset=".55" stop-color="#bea4ec"/><stop offset="1" stop-color="#9b7acb"/></linearGradient>
    <radialGradient id="ambient"><stop stop-color="#f7bde8" stop-opacity=".5"/><stop offset="1" stop-color="#e9c6ff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#654393" flood-opacity=".18"/></filter>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="8"/></filter>
    <clipPath id="window"><rect x="60" y="210" width="395" height="618" rx="10"/></clipPath>
    <pattern id="quilt-dots" width="52" height="52" patternUnits="userSpaceOnUse"><path d="m15 10 3 5-3 5-3-5Z" fill="#ede1ff" fill-opacity=".7"/></pattern>
  </defs>
