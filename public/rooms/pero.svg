<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" fill="none">
  <title>Pero 的晴空房间</title>
  <desc>蓝白配色的明亮房间，窗外有云朵和樱花，窗边是书桌，另一侧摆着柔软的床和星形靠垫，中央留给角色。</desc>
  <defs>
    <linearGradient id="wall" x2=".75" y2="1"><stop stop-color="#f4fcff"/><stop offset=".6" stop-color="#e4f6ff"/><stop offset="1" stop-color="#c8e8fb"/></linearGradient>
    <linearGradient id="side" x2="1" y2="1"><stop stop-color="#bddff5"/><stop offset="1" stop-color="#e0f2ff"/></linearGradient>
    <linearGradient id="sky" y2="1"><stop stop-color="#59b8ed"/><stop offset=".65" stop-color="#a9e2ff"/><stop offset="1" stop-color="#effaff"/></linearGradient>
    <linearGradient id="floor" y2="1"><stop stop-color="#e0c6b6"/><stop offset="1" stop-color="#f9e9d8"/></linearGradient>
    <linearGradient id="curtain" x2="1"><stop stop-color="#63b8ed"/><stop offset=".22" stop-color="#a9e2ff"/><stop offset=".5" stop-color="#7ec5f3"/><stop offset=".75" stop-color="#b8e8ff"/><stop offset="1" stop-color="#75b9e6"/></linearGradient>
    <linearGradient id="quilt" x2=".2" y2="1"><stop stop-color="#e2f6ff"/><stop offset=".5" stop-color="#b4e2fc"/><stop offset="1" stop-color="#83c6ed"/></linearGradient>
    <linearGradient id="sunbeam" x2="1" y2="1"><stop stop-color="#fff8cf" stop-opacity=".6"/><stop offset="1" stop-color="#fffdf1" stop-opacity="0"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#ffffff" stop-opacity=".85"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#4383b1" flood-opacity=".14"/></filter>
    <clipPath id="window"><rect x="60" y="210" width="395" height="618" rx="10"/></clipPath>
    <pattern id="quilt-dots" width="45" height="45" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3" fill="#fff" fill-opacity=".65"/></pattern>
  </defs>
